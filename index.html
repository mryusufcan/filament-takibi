<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Filament Takibi</title>
<style>
:root{
  --bg:#f6f5f2; --card:#ffffff; --text:#1d1d1b; --muted:#6b6a65; --line:#e4e2dc;
  --accent:#d9541e; --accent-ink:#ffffff; --ok:#2f9e5b; --warn:#d99a12; --bad:#d64545;
  --track:#ecebe6; --input:#ffffff; --shadow:0 1px 2px rgba(0,0,0,.06);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161614; --card:#201f1d; --text:#f1efe9; --muted:#a19f97; --line:#34332f;
    --accent:#ef6a35; --accent-ink:#161614; --ok:#43b874; --warn:#e6ad2e; --bad:#ec5b5b;
    --track:#2e2d29; --input:#2a2926; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#161614; --card:#201f1d; --text:#f1efe9; --muted:#a19f97; --line:#34332f;
  --accent:#ef6a35; --accent-ink:#161614; --ok:#43b874; --warn:#e6ad2e; --bad:#ec5b5b;
  --track:#2e2d29; --input:#2a2926; --shadow:none;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px;line-height:1.4}
.wrap{max-width:960px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
h1{font-size:22px;margin:0}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 14px}
button:hover{border-color:var(--muted)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.primary:hover{filter:brightness(1.08)}
button.danger{color:var(--bad)}
button.small{padding:6px 10px;font-size:14px}
input,select,textarea{font:inherit;color:var(--text);background:var(--input);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input[type=color]{padding:2px;height:40px;cursor:pointer}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:24px}
.stat span{color:var(--muted);font-size:13px}

.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.tools .search{flex:1 1 200px}
.tools .sort{flex:0 1 200px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{border-radius:999px;padding:5px 12px;font-size:14px}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.top{display:flex;gap:12px;align-items:center}
.swatch{width:44px;height:44px;border-radius:50%;border:3px solid var(--line);flex:none}
.ttl{min-width:0;flex:1}
.ttl b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ttl span{color:var(--muted);font-size:13px}
.badge{font-size:12px;font-weight:600;border-radius:999px;padding:2px 8px;color:#fff;background:var(--bad);white-space:nowrap}
.bar{height:10px;background:var(--track);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px}
.nums{display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}
.nums b{color:var(--text)}
.use{display:flex;gap:8px}
.use input{flex:1;min-width:0}
.acts{display:flex;gap:8px;justify-content:flex-end}
.toggle{width:100%;background:transparent;color:var(--muted)}
.panel{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:10px}
.note{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.empty{text-align:center;color:var(--muted);padding:40px 12px;border:1px dashed var(--line);border-radius:16px}
footer{margin-top:24px;color:var(--muted);font-size:13px;text-align:center}

dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--text);padding:0;width:min(440px,calc(100% - 24px));max-height:calc(100% - 24px)}
dialog::backdrop{background:rgba(0,0,0,.45)}
form{display:flex;flex-direction:column;gap:12px;padding:18px}
form h2{margin:0;font-size:18px}
label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 90px;gap:10px}
.formacts{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
.backup{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:28px}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
@media (max-width:640px){.charts{grid-template-columns:1fr}}
.chart{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.chart h3{margin:0 0 10px;font-size:15px}
.crow{display:grid;grid-template-columns:92px 1fr 64px;gap:8px;align-items:center;margin-bottom:8px;font-size:14px}
.cname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cbar{height:20px;background:var(--track);border-radius:6px;overflow:hidden}
.cbar b{display:block;height:100%;border-radius:6px;box-shadow:inset 0 0 0 1px rgba(128,128,128,.35)}
.cval{text-align:right;font-size:13px;font-weight:600;white-space:nowrap}
.chead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.chead h3{margin:0}
.chead select{width:auto;padding:4px 8px;font-size:14px}
.cbar.stack{display:flex}
.cbar .seg{flex:none;border-radius:0;box-shadow:inset -1px 0 0 rgba(128,128,128,.45)}
.mrow .crow{margin-bottom:4px}
.mleg{display:flex;flex-wrap:wrap;gap:2px 10px;margin:0 0 12px 100px;font-size:12px;color:var(--muted)}
.litem{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.litem i{width:9px;height:9px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(128,128,128,.5)}
.hist{margin-top:20px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 14px 10px;box-shadow:var(--shadow)}
.hist summary{cursor:pointer;padding:10px 0;font-weight:600}
.hsum{color:var(--muted);font-size:13px;margin:0 0 8px}
.hday{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin:12px 0 4px}
.hrow{display:grid;grid-template-columns:14px 1fr auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.hrow i{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(128,128,128,.4)}
.hd{min-width:0}
.hd small,.hv small{display:block;color:var(--muted);font-size:12px;font-weight:400}
.hv{font-weight:600;white-space:nowrap;text-align:right}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--text);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:14px;display:none;z-index:10}
@media (max-width:480px){.stat b{font-size:20px}}

/* sadeleştirme */
.card{padding:16px;gap:12px}
.swatch{width:48px;height:48px}
.ttl b{font-size:18px}
.nums{align-items:baseline}
.nums b{font-size:24px}
.nums span:last-child{font-size:15px}
button{min-height:42px}
button.small{padding:8px 12px;min-height:40px}
input,select,textarea{min-height:42px}
.toggle{min-height:44px}
.grid{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{padding:6px 12px;min-height:36px;font-size:14px}
.hint{font-size:12px;font-weight:400;color:var(--muted)}
details.adv{border:1px solid var(--line);border-radius:12px;padding:0 12px}
details.adv summary{cursor:pointer;padding:10px 0;font-weight:600;color:var(--text);font-size:14px}
.advbody{display:flex;flex-direction:column;gap:12px;padding-bottom:12px}
.hist.fold{margin:0 0 16px}
.hist .charts{margin:0 0 8px}
.onboard{grid-column:1 / -1;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.onboard h2{margin:0 0 10px;font-size:18px}
.onboard ol{margin:0 0 14px;padding-left:20px;color:var(--muted)}
.onboard li{margin-bottom:6px}

.charts{grid-template-columns:1fr}
.mgroup{margin-bottom:18px}
.mgroup:last-child{margin-bottom:4px}
.mhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-bottom:1px solid var(--line);padding-bottom:4px;margin-bottom:8px}
.mhead b{font-size:16px}
.mhead span{color:var(--muted);font-size:13px}

.slist{display:flex;flex-direction:column}
.srow{display:flex;justify-content:space-between;align-items:center;width:100%;background:transparent;border:0;border-top:1px solid var(--line);border-radius:0;padding:10px 2px;min-height:44px;font-size:15px;text-align:left}
.srow:hover{border-color:var(--line);background:transparent}
.snm{color:var(--muted)}
.sv{font-weight:600}
.sv.low{color:var(--bad)}
.sv em{font-style:normal;color:var(--muted);font-weight:400}
.slist .panel{border-top:0;padding:4px 2px 12px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🧵 Filament Takibi</h1>
    <button class="primary" id="addBtn">+ Yeni makara</button>
  </header>

  <section class="stats">
    <div class="stat"><b id="stCount">0</b><span>Makara</span></div>
    <div class="stat"><b id="stKg">0 kg</b><span>Toplam kalan</span></div>
    <div class="stat"><b id="stLow">0</b><span>Azalan (%20 altı)</span></div>
  </section>

  <details class="hist fold" id="chartsWrap" style="display:none">
    <summary>Grafikler</summary>
  <section class="charts" id="charts">
    <div class="chart"><h3>Malzemeye göre kalan</h3><div id="chMat"></div></div>
  </section>
  </details>

  <div class="tools">
    <input class="search" id="q" type="search" placeholder="Ara: marka, renk, malzeme…">
    <select class="sort" id="sort">
      <option value="low">Kalan: azdan çoğa</option>
      <option value="high">Kalan: çoktan aza</option>
      <option value="new">En yeni</option>
      <option value="mat">Malzeme</option>
    </select>
  </div>
  <div class="chips" id="chips"></div>

  <div class="grid" id="list"></div>
  <details class="hist" id="hist">
    <summary id="histSum">Geçmiş</summary>
    <div id="histBody"></div>
  </details>

  <div class="backup">
    <button type="button" class="small" id="exportBtn">⬇ Yedek indir (CSV)</button>
    <button type="button" class="small" id="importBtn">⬆ Yedekten yükle</button>
    <input type="file" id="importFile" accept=".csv,text/csv,text/plain" hidden>
  </div>
  <footer id="foot"></footer>
</div>

<dialog id="dlg">
  <form id="form" method="dialog">
    <h2 id="dlgTitle">Yeni makara</h2>
    <div class="row">
      <label>Marka<input id="fBrand" placeholder="ör. eSUN" maxlength="40"></label>
      <label>Malzeme
        <select id="fMat">
          <option>PLA</option><option>PLA+</option><option>PETG</option><option>ABS</option>
          <option>ASA</option><option>TPU</option><option>Diğer</option>
        </select>
      </label>
    </div>
    <div class="row3">
      <label>Renk adı<input id="fColor" placeholder="ör. Siyah" maxlength="40"></label>
      <label>Renk<input id="fHex" type="color" value="#333333"></label>
    </div>
    <details class="adv" id="fAdv">
      <summary>Gelişmiş (ağırlık, fiyat, not)</summary>
      <div class="advbody">
        <div class="row">
          <label>Makaradaki filament (g)<input id="fInit" type="number" min="1" step="1" value="1000"><span class="hint">Yeni makarada genelde 1000.</span></label>
          <label>Şu an kalan (g)<input id="fRem" type="number" min="0" step="1" placeholder="boşsa dolu"><span class="hint">Boş bırakırsan dolu sayılır.</span></label>
        </div>
        <div class="row">
          <label>Boş makara (g)<input id="fTare" type="number" min="0" step="1" value="200"><span class="hint">Tartıdan hesaplamak için. Genelde 150-250.</span></label>
          <label>Fiyat (₺)<input id="fPrice" type="number" min="0" step="1"><span class="hint">İsteğe bağlı.</span></label>
        </div>
        <label>Not<textarea id="fNote" rows="2" maxlength="200"></textarea><span class="hint">İsteğe bağlı.</span></label>
      </div>
    </details>
    <div class="formacts">
      <button type="button" id="cancelBtn">Vazgeç</button>
      <button type="submit" class="primary">Kaydet</button>
    </div>
  </form>
</dialog>
<div id="toast"></div>

<script>
(function(){
  var LS_KEY = 'filament-spools-v1';
  var spools = [];
  var dbh = null;
  var filterMat = 'Tümü';
  var editingId = null;
  var chain = Promise.resolve();

  function $(id){ return document.getElementById(id); }
  function el(tag, cls, text){
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function toast(msg){
    var t = $('toast'); t.textContent = msg; t.style.display = 'block';
    clearTimeout(toast._t); toast._t = setTimeout(function(){ t.style.display = 'none'; }, 2200);
  }
  function num(v, d){ var n = parseFloat(v); return isFinite(n) ? n : d; }
  function fmt(n){ return (Math.round(n * 10) / 10).toString().replace('.', ','); }
  function safeHex(h){ return /^#[0-9a-fA-F]{6}$/.test(h) ? h : '#888888'; }
  function newId(){ return 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  var LOG_KINDS = { use: 1, weigh: 1, add: 1, edit: 1 };
  function normLog(a){
    if (!Array.isArray(a)) return [];
    return a.filter(function(e){
      return e && typeof e === 'object' && Object.prototype.hasOwnProperty.call(LOG_KINDS, e.k) &&
             isFinite(e.t) && isFinite(e.g) && isFinite(e.r);
    }).map(function(e){
      return { t: +e.t, k: e.k, g: Math.round(+e.g * 10) / 10, r: Math.round(+e.r * 10) / 10 };
    }).slice(-100);
  }
  function withLog(s, kind, grams, rem){
    var log = (s.log || []).concat([{ t: Date.now(), k: kind, g: Math.round(grams * 10) / 10, r: Math.round(rem * 10) / 10 }]);
    return Object.assign({}, s, { log: log.slice(-100) });
  }

  /* ---------- storage ---------- */
  function lsLoad(){
    try { var raw = localStorage.getItem(LS_KEY); return raw ? JSON.parse(raw) : []; }
    catch(e){ return []; }
  }
  function lsSave(){
    try { localStorage.setItem(LS_KEY, JSON.stringify(spools)); } catch(e){}
  }
  function body(s){
    return { brand:s.brand, material:s.material, colorName:s.colorName, colorHex:s.colorHex,
             initial:s.initial, remaining:s.remaining, spoolWeight:s.spoolWeight || 0, price:s.price, note:s.note, createdAt:s.createdAt, log:s.log || [] };
  }
  function persist(fn){
    chain = chain.then(fn).catch(function(e){ console.error(e); toast('Kaydedilemedi, tekrar dene'); });
  }
  function saveSpool(s){
    if (dbh){
      persist(function(){ return dbh.doc('spools/' + s.id).set(body(s)); });
    } else {
      var i = spools.findIndex(function(x){ return x.id === s.id; });
      if (i >= 0) spools[i] = s; else spools.push(s);
      lsSave(); render();
    }
  }
  function removeSpool(id){
    if (dbh){
      persist(function(){ return dbh.doc('spools/' + id).delete(); });
    } else {
      spools = spools.filter(function(x){ return x.id !== id; });
      lsSave(); render();
    }
  }

  /* ---------- render ---------- */
  function pctOf(s){ return s.initial > 0 ? Math.max(0, Math.min(100, s.remaining / s.initial * 100)) : 0; }
  function barColor(p){ return p > 50 ? 'var(--ok)' : p > 20 ? 'var(--warn)' : 'var(--bad)'; }

  function render(){
    var total = 0, low = 0;
    spools.forEach(function(s){ total += s.remaining; if (pctOf(s) <= 20) low++; });
    $('stCount').textContent = spools.length;
    $('stKg').textContent = fmt(total / 1000) + ' kg';
    $('stLow').textContent = low;
    renderCharts();
    renderHistory();

    // chips
    var mats = ['Tümü'];
    spools.forEach(function(s){ if (mats.indexOf(s.material) < 0) mats.push(s.material); });
    if (mats.indexOf(filterMat) < 0) filterMat = 'Tümü';
    var chips = $('chips'); chips.textContent = '';
    if (mats.length > 2){
      mats.forEach(function(m){
        var b = el('button', 'chip' + (m === filterMat ? ' on' : ''), m);
        b.type = 'button';
        b.onclick = function(){ filterMat = m; render(); };
        chips.appendChild(b);
      });
    }

    // filter + sort
    var q = $('q').value.trim().toLowerCase();
    var view = spools.filter(function(s){
      if (filterMat !== 'Tümü' && s.material !== filterMat) return false;
      if (!q) return true;
      return (s.brand + ' ' + s.colorName + ' ' + s.material + ' ' + s.note).toLowerCase().indexOf(q) >= 0;
    });
    var mode = $('sort').value;
    var gmap = {}, groups = [];
    view.forEach(function(s){
      var key = s.material + '|' + ((s.colorName || '').trim().toLocaleLowerCase('tr') || '(adsiz)');
      var g = gmap[key];
      if (!g){ g = gmap[key] = { material: s.material, colorName: (s.colorName || '').trim(), spools: [] }; groups.push(g); }
      g.spools.push(s);
    });
    groups.forEach(function(g){
      g.spools.sort(function(a, b){ return (a.createdAt || 0) - (b.createdAt || 0) || (a.id < b.id ? -1 : 1); });
      g.total = 0; g.initial = 0; g.newest = 0;
      var big = g.spools[0];
      g.spools.forEach(function(s){
        g.total += s.remaining; g.initial += s.initial;
        if ((s.createdAt || 0) > g.newest) g.newest = s.createdAt || 0;
        if (s.remaining > big.remaining) big = s;
      });
      g.total = Math.round(g.total * 10) / 10;
      g.colorHex = safeHex(big.colorHex);
    });
    groups.sort(function(a, b){
      if (mode === 'low') return a.total - b.total;
      if (mode === 'high') return b.total - a.total;
      if (mode === 'mat') return a.material.localeCompare(b.material, 'tr') || a.colorName.localeCompare(b.colorName, 'tr');
      return b.newest - a.newest;
    });
    view = groups;

    var list = $('list'); list.textContent = '';
    document.querySelector('.stats').style.display = spools.length ? '' : 'none';
    document.querySelector('.tools').style.display = spools.length ? '' : 'none';
    if (!view.length){
      if (!spools.length) list.appendChild(onboardEl());
      else {
        var em = el('div', 'empty', 'Sonuç yok.');
        em.style.gridColumn = '1 / -1';
        list.appendChild(em);
      }
    }
    view.forEach(function(s){ list.appendChild(card(s)); });
  }

  var PAL = ['#d9541e','#2f7fd9','#2f9e5b','#8a5cd6','#d99a12','#d6457a','#3aa6a6','#7a6a55'];
  function fmtW(g){ return g >= 1000 ? fmt(g / 1000) + ' kg' : fmt(g) + ' g'; }
  function drawBars(host, rows){
    host.textContent = '';
    var max = 0;
    rows.forEach(function(r){ if (r.total > max) max = r.total; });
    rows.forEach(function(r){
      var row = el('div', 'crow');
      row.title = r.label + ': ' + fmtW(r.total) + ' (' + r.count + ' makara)';
      row.appendChild(el('div', 'cname', r.label));
      var bar = el('div', 'cbar'), f = el('b');
      f.style.width = (max > 0 ? Math.max(3, r.total / max * 100) : 0) + '%';
      f.style.background = r.color;
      bar.appendChild(f);
      row.appendChild(bar);
      row.appendChild(el('div', 'cval', fmtW(r.total)));
      host.appendChild(row);
    });
  }
  function dayKey(t){ var d = new Date(t); return d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate(); }
  function dayLabel(t){
    var now = new Date(), d = new Date(t);
    var a = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
    var b = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
    var diff = Math.round((a - b) / 86400000);
    if (diff === 0) return 'Bugün';
    if (diff === 1) return 'Dün';
    var opt = { day: 'numeric', month: 'long' };
    if (d.getFullYear() !== now.getFullYear()) opt.year = 'numeric';
    return d.toLocaleDateString('tr-TR', opt);
  }
  function renderHistory(){
    var all = [];
    spools.forEach(function(s){ (s.log || []).forEach(function(e){ all.push({ e: e, s: s }); }); });
    all.sort(function(a, b){ return b.e.t - a.e.t; });
    $('histSum').textContent = 'Geçmiş' + (all.length ? ' (' + all.length + ')' : '');
    var body = $('histBody'); body.textContent = '';
    if (!all.length){
      body.appendChild(el('div', 'hsum', 'Henüz kayıt yok. Filament düştüğünde veya makara eklediğinde burada görünür.'));
      return;
    }
    var now = Date.now(), w7 = 0, w30 = 0;
    all.forEach(function(x){
      var e = x.e;
      var used = e.k === 'use' ? e.g : (e.k === 'weigh' && e.g < 0 ? -e.g : 0);
      if (now - e.t <= 7 * 86400000) w7 += used;
      if (now - e.t <= 30 * 86400000) w30 += used;
    });
    body.appendChild(el('div', 'hsum', 'Kullanılan: son 7 gün ' + fmtW(w7) + ' · son 30 gün ' + fmtW(w30)));
    var lastDay = '';
    all.slice(0, 60).forEach(function(x){
      var e = x.e, s = x.s, dk = dayKey(e.t);
      if (dk !== lastDay){ body.appendChild(el('div', 'hday', dayLabel(e.t))); lastDay = dk; }
      var row = el('div', 'hrow');
      var dot = el('i'); dot.style.background = safeHex(s.colorHex);
      var hd = el('div', 'hd');
      hd.appendChild(document.createTextNode((s.colorName || 'Renksiz') + ' · ' + (s.brand ? s.brand + ' ' : '') + s.material));
      var what = e.k === 'use' ? 'Kullanıldı' : e.k === 'weigh' ? 'Tartıdan güncellendi' : e.k === 'add' ? 'Makara eklendi' : 'Elle düzenlendi';
      hd.appendChild(el('small', '', what));
      var hv = el('div', 'hv');
      var sign = e.k === 'use' ? '−' : (e.g < 0 ? '−' : '+');
      hv.appendChild(document.createTextNode(sign + fmt(Math.abs(e.g)) + ' g'));
      hv.appendChild(el('small', '', 'kalan ' + fmt(e.r) + ' g · ' + new Date(e.t).toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' })));
      row.appendChild(dot); row.appendChild(hd); row.appendChild(hv);
      body.appendChild(row);
    });
    if (all.length > 60) body.appendChild(el('div', 'hsum', 'Son 60 kayıt gösteriliyor.'));
  }
  var chartMat = 'Tümü';
  function drawGrouped(host, groups, max){
    host.textContent = '';
    groups.forEach(function(g){
      var box = el('div', 'mgroup');
      var head = el('div', 'mhead');
      head.appendChild(el('b', '', g.label));
      head.appendChild(el('span', '', fmtW(g.total) + ' · ' + g.count + ' makara'));
      box.appendChild(head);
      g.parts.forEach(function(p){
        var row = el('div', 'crow');
        row.title = p.label + ': ' + fmtW(p.total);
        row.appendChild(el('div', 'cname', p.label));
        var bar = el('div', 'cbar'), f = el('b');
        f.style.width = (max > 0 ? Math.max(3, p.total / max * 100) : 0) + '%';
        f.style.background = p.hex;
        bar.appendChild(f);
        row.appendChild(bar);
        row.appendChild(el('div', 'cval', fmtW(p.total)));
        box.appendChild(row);
      });
      host.appendChild(box);
    });
  }
  function renderCharts(){
    var sec = $('chartsWrap'), mats = {};
    function toRows(o){
      return Object.keys(o).map(function(k){ return o[k]; }).sort(function(a, b){ return b.total - a.total; });
    }
    spools.forEach(function(s){
      if (s.remaining <= 0) return;
      var m = mats[s.material] || (mats[s.material] = { label: s.material, total: 0, count: 0, cols: {} });
      m.total += s.remaining; m.count++;
      var cn = (s.colorName || '').trim();
      var ck = cn.toLocaleLowerCase('tr') || '(adsiz)';
      var pc = m.cols[ck] || (m.cols[ck] = { label: cn || 'Adsız', total: 0, hex: safeHex(s.colorHex), best: 0 });
      pc.total += s.remaining;
      if (s.remaining > pc.best){ pc.best = s.remaining; pc.hex = safeHex(s.colorHex); }
    });
    var mRows = toRows(mats);
    if (!mRows.length){ sec.style.display = 'none'; return; }
    sec.style.display = '';
    var max = 0;
    mRows.forEach(function(m){
      m.parts = toRows(m.cols);
      m.parts.forEach(function(p){ if (p.total > max) max = p.total; });
    });
    drawGrouped($('chMat'), mRows, max);
  }

  function onboardEl(){
    var b = el('div', 'onboard');
    b.appendChild(el('h2', '', 'Başlamak için 3 adım'));
    var ol = el('ol');
    [
      '“+ Yeni makara” ile makaranı ekle. Marka, malzeme ve renk yeterli.',
      'Baskıdan sonra makara kartında “İşlemler”e bas, kullandığın gramı yaz ve “Kullandım”a bas.',
      'Filament azalınca kartta “Azaldı” uyarısı çıkar.'
    ].forEach(function(t){ ol.appendChild(el('li', '', t)); });
    b.appendChild(ol);
    var btn = el('button', 'primary', '+ İlk makarayı ekle'); btn.type = 'button';
    btn.onclick = function(){ openDlg(null); };
    b.appendChild(btn);
    return b;
  }
  var openIds = {};
  function spoolPanel(s){
    var tare = s.spoolWeight || 0;
    var panel = el('div', 'panel');
    panel.appendChild(el('div', 'note', (s.brand ? s.brand + ' · ' : '') + 'Makara ' + fmt(s.initial) + ' g · kalan ' + fmt(s.remaining) + ' g'));
    if (tare > 0) panel.appendChild(el('div', 'note', 'Tartıda görünmesi gereken: ' + fmt(s.remaining + tare) + ' g (boş makara ' + fmt(tare) + ' g)'));
    if (s.price) panel.appendChild(el('div', 'note', 'Fiyat: ' + fmt(s.price) + ' ₺'));
    if (s.note) panel.appendChild(el('div', 'note', s.note));

    var use = el('div', 'use');
    var inp = el('input'); inp.type = 'number'; inp.min = '0'; inp.step = '1'; inp.placeholder = 'Kullandığım gram';
    var ub = el('button', 'small', 'Kullandım'); ub.type = 'button';
    function doUse(){
      var g = num(inp.value, 0);
      if (g <= 0) return;
      var newRem = Math.max(0, Math.round((s.remaining - g) * 10) / 10);
      var used = Math.round((s.remaining - newRem) * 10) / 10;
      if (used <= 0) return;
      delete openIds[s.id];
      saveSpool(withLog(Object.assign({}, s, { remaining: newRem }), 'use', used, newRem));
      if (dbh) render();
    }
    ub.onclick = doUse;
    inp.onkeydown = function(e){ if (e.key === 'Enter'){ e.preventDefault(); doUse(); } };
    panel.appendChild(el('div', 'hint', 'Kullandığın gramı yaz veya hızlı düğmelere bas:'));
    var quick = el('div', 'quick');
    [10, 25, 50, 100].forEach(function(q){
      var qb = el('button', '', '+' + q + ' g'); qb.type = 'button';
      qb.onclick = function(){ inp.value = Math.round((num(inp.value, 0) + q) * 10) / 10; };
      quick.appendChild(qb);
    });
    panel.appendChild(quick);
    use.appendChild(inp); use.appendChild(ub); panel.appendChild(use);

    var weigh = el('div', 'use');
    var winp = el('input'); winp.type = 'number'; winp.min = '0'; winp.step = '1'; winp.placeholder = 'Tartıdaki toplam (makara dahil)';
    var wb = el('button', 'small', 'Tartıdan güncelle'); wb.type = 'button';
    function doWeigh(){
      var gross = num(winp.value, -1);
      if (gross < 0) return;
      var rem = Math.max(0, Math.min(s.initial, Math.round((gross - tare) * 10) / 10));
      var delta = Math.round((rem - s.remaining) * 10) / 10;
      var ns = Object.assign({}, s, { remaining: rem });
      delete openIds[s.id];
      saveSpool(delta !== 0 ? withLog(ns, 'weigh', delta, rem) : ns);
      if (dbh) render();
    }
    wb.onclick = doWeigh;
    winp.onkeydown = function(e){ if (e.key === 'Enter'){ e.preventDefault(); doWeigh(); } };
    panel.appendChild(el('div', 'hint', 'Ya da makarayı tartıp toplam ağırlığı yaz (makara dahil):'));
    weigh.appendChild(winp); weigh.appendChild(wb); panel.appendChild(weigh);

    var acts = el('div', 'acts');
    var eb = el('button', 'small', 'Düzenle'); eb.type = 'button';
    eb.onclick = function(){ openDlg(s); };
    var db_ = el('button', 'small danger', 'Sil'); db_.type = 'button';
    var armed = false;
    db_.onclick = function(){
      if (!armed){
        armed = true; db_.textContent = 'Emin misin?';
        setTimeout(function(){ armed = false; db_.textContent = 'Sil'; }, 3000);
      } else { delete openIds[s.id]; removeSpool(s.id); }
    };
    acts.appendChild(eb); acts.appendChild(db_); panel.appendChild(acts);
    return panel;
  }

  function card(g){
    var multi = g.spools.length > 1, one = g.spools[0];
    var p = g.initial > 0 ? Math.max(0, Math.min(100, g.total / g.initial * 100)) : 0;
    var c = el('div', 'card');

    var top = el('div', 'top');
    var sw = el('div', 'swatch'); sw.style.background = g.colorHex;
    var t = el('div', 'ttl');
    t.appendChild(el('b', '', g.colorName || 'Renksiz'));
    t.appendChild(el('span', '', multi
      ? g.material + ' · ' + g.spools.length + ' makara'
      : (one.brand ? one.brand + ' · ' : '') + g.material + ' · ' + fmt(one.initial) + ' g'));
    top.appendChild(sw); top.appendChild(t);
    if (g.total <= 0) top.appendChild(el('span', 'badge', 'Bitti'));
    else if (p <= 20) top.appendChild(el('span', 'badge', 'Azaldı'));
    c.appendChild(top);

    var bar = el('div', 'bar'); var fill = el('i');
    fill.style.width = p + '%'; fill.style.background = barColor(p);
    bar.appendChild(fill); c.appendChild(bar);

    var nums = el('div', 'nums');
    var l = el('span'); l.appendChild(el('b', '', fmtW(g.total))); l.appendChild(document.createTextNode(' kaldı'));
    nums.appendChild(l); nums.appendChild(el('span', '', '%' + Math.round(p)));
    c.appendChild(nums);

    if (multi){
      var list = el('div', 'slist');
      g.spools.forEach(function(s, i){
        var low = pctOf(s) <= 20;
        var isOpen = !!openIds[s.id];
        var row = el('button', 'srow'); row.type = 'button';
        row.appendChild(el('span', 'snm', (s.brand || 'Makara') + ' ' + (i + 1)));
        var v = el('span', 'sv' + (low ? ' low' : ''), fmt(s.remaining) + ' g');
        v.appendChild(el('em', '', isOpen ? ' ▴' : ' ▾'));
        row.appendChild(v);
        row.onclick = function(){ if (openIds[s.id]) delete openIds[s.id]; else openIds[s.id] = 1; render(); };
        list.appendChild(row);
        if (isOpen) list.appendChild(spoolPanel(s));
      });
      c.appendChild(list);
    } else {
      var open = !!openIds[one.id];
      var tog = el('button', 'small toggle', open ? 'Kapat ▴' : 'İşlemler ▾');
      tog.type = 'button';
      tog.onclick = function(){ if (openIds[one.id]) delete openIds[one.id]; else openIds[one.id] = 1; render(); };
      c.appendChild(tog);
      if (open) c.appendChild(spoolPanel(one));
    }
    return c;
  }

  /* ---------- dialog ---------- */
  function openDlg(s){
    editingId = s ? s.id : null;
    $('dlgTitle').textContent = s ? 'Makarayı düzenle' : 'Yeni makara';
    $('fBrand').value = s ? s.brand : '';
    $('fMat').value = s ? s.material : 'PLA';
    $('fColor').value = s ? s.colorName : '';
    $('fHex').value = s ? safeHex(s.colorHex) : '#333333';
    $('fInit').value = s ? s.initial : 1000;
    $('fRem').value = s ? s.remaining : '';
    $('fTare').value = s ? (s.spoolWeight || 0) : 200;
    $('fPrice').value = s && s.price ? s.price : '';
    $('fNote').value = s ? s.note : '';
    $('fAdv').open = !!s;
    var d = $('dlg');
    if (d.showModal) d.showModal(); else d.setAttribute('open', '');
  }
  function closeDlg(){
    var d = $('dlg');
    if (d.close) d.close(); else d.removeAttribute('open');
  }
  $('addBtn').onclick = function(){ openDlg(null); };
  $('cancelBtn').onclick = closeDlg;
  $('form').onsubmit = function(e){
    e.preventDefault();
    var initial = Math.max(1, num($('fInit').value, 1000));
    var remRaw = $('fRem').value.trim();
    var remaining = remRaw === '' ? initial : Math.max(0, num(remRaw, initial));
    if (remaining > initial) remaining = initial;
    var old = editingId ? spools.find(function(x){ return x.id === editingId; }) : null;
    var s = {
      id: editingId || newId(),
      brand: $('fBrand').value.trim(),
      material: $('fMat').value,
      colorName: $('fColor').value.trim(),
      colorHex: safeHex($('fHex').value),
      initial: initial,
      remaining: remaining,
      spoolWeight: Math.max(0, num($('fTare').value, 0)),
      price: Math.max(0, num($('fPrice').value, 0)),
      note: $('fNote').value.trim(),
      createdAt: old && old.createdAt ? old.createdAt : Date.now(),
      log: old && old.log ? old.log : []
    };
    if (!old) s = withLog(s, 'add', remaining, remaining);
    else if (old.remaining !== remaining) s = withLog(s, 'edit', remaining - old.remaining, remaining);
    saveSpool(s);
    closeDlg();
  };

  /* ---------- backup (CSV) ---------- */
  var dl = null;
  var standalone = false;
  $('exportBtn').style.display = 'none';
  if (window.claude && window.claude.use){
    window.claude.use('downloads').then(function(d){
      if (d){ dl = d; $('exportBtn').style.display = ''; }
    }).catch(function(){});
  } else {
    standalone = true;
    $('exportBtn').style.display = '';
  }

  var COLS = ['id','marka','malzeme','renk','renk_kodu','filament_g','kalan_g','bos_makara_g','fiyat','not'];

  function cell(v, textual){
    var s = String(v == null ? '' : v);
    if (textual && /^[=+\-@\t\r]/.test(s)) s = "'" + s;
    if (/[;",\n\r]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
    return s;
  }
  function toCSV(){
    var lines = [COLS.join(';')];
    spools.forEach(function(s){
      lines.push([
        cell(s.id), cell(s.brand, true), cell(s.material, true), cell(s.colorName, true), cell(s.colorHex),
        cell(s.initial), cell(s.remaining), cell(s.spoolWeight || 0), cell(s.price || 0), cell(s.note, true)
      ].join(';'));
    });
    return '\uFEFF' + lines.join('\r\n') + '\r\n';
  }
  $('exportBtn').onclick = function(){
    if (!dl && !standalone) return;
    if (!spools.length){ toast('Yedeklenecek makara yok'); return; }
    var date = new Date().toISOString().slice(0, 10);
    var fname = 'filament-yedek-' + date + '.csv';
    if (!dl){
      try {
        var blob = new Blob([toCSV()], { type: 'text/csv;charset=utf-8' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url; a.download = fname;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
        toast('Yedek indirildi');
      } catch(e){ toast('Yedek indirilemedi'); }
      return;
    }
    dl.save({ filename: fname, data: toCSV() })
      .then(function(){ toast('Yedek kaydedildi'); })
      .catch(function(e){
        if (e && e.code === 'declined') return;
        toast('Yedek indirilemedi');
      });
  };

  function parseCSV(text, delim){
    var rows = [], row = [], f = '', q = false;
    for (var i = 0; i < text.length; i++){
      var ch = text[i];
      if (q){
        if (ch === '"'){ if (text[i + 1] === '"'){ f += '"'; i++; } else q = false; }
        else f += ch;
      } else if (ch === '"'){ q = true; }
      else if (ch === delim){ row.push(f); f = ''; }
      else if (ch === '\n' || ch === '\r'){
        if (ch === '\r' && text[i + 1] === '\n') i++;
        row.push(f); f = ''; rows.push(row); row = [];
      } else f += ch;
    }
    if (f !== '' || row.length){ row.push(f); rows.push(row); }
    return rows.filter(function(r){ return r.some(function(c){ return c.trim() !== ''; }); });
  }
  function numTR(v, d){ return num(String(v).replace(',', '.'), d); }

  function importCsv(text){
    text = text.replace(/^\uFEFF/, '');
    var first = text.split(/\r?\n/)[0] || '';
    var delim = first.split(';').length >= first.split(',').length ? ';' : ',';
    var rows = parseCSV(text, delim);
    if (rows.length < 2){ toast('Dosyada makara yok'); return; }
    var head = rows[0].map(function(h){ return h.trim().toLowerCase(); });
    if (head.indexOf('filament_g') < 0 && head.indexOf('kalan_g') < 0){ toast('Bu dosya tanınmadı'); return; }
    function col(r, name){ var i = head.indexOf(name); return i < 0 || r[i] == null ? '' : String(r[i]); }
    function txt(v, max){ v = v.trim(); if (/^'[=+\-@\t\r]/.test(v)) v = v.slice(1); return v.slice(0, max); }

    var n = 0;
    rows.slice(1, 501).forEach(function(r){
      var initial = Math.max(1, numTR(col(r, 'filament_g'), 1000));
      var remRaw = col(r, 'kalan_g').trim();
      var remaining = remRaw === '' ? initial : Math.min(initial, Math.max(0, numTR(remRaw, initial)));
      var rid = col(r, 'id').trim();
      if (!/^[A-Za-z0-9_\-.~:@+]{1,100}$/.test(rid)) rid = newId();
      var old = spools.find(function(x){ return x.id === rid; });
      saveSpool({
        id: rid,
        brand: txt(col(r, 'marka'), 40),
        material: txt(col(r, 'malzeme'), 20) || 'Diğer',
        colorName: txt(col(r, 'renk'), 40),
        colorHex: safeHex(col(r, 'renk_kodu').trim()),
        initial: initial,
        remaining: remaining,
        spoolWeight: Math.max(0, numTR(col(r, 'bos_makara_g'), 0)),
        price: Math.max(0, numTR(col(r, 'fiyat'), 0)),
        note: txt(col(r, 'not'), 200),
        createdAt: old && old.createdAt ? old.createdAt : Date.now(),
        log: old && old.log ? old.log : []
      });
      n++;
    });
    toast(n + ' makara yüklendi');
  }
  $('importBtn').onclick = function(){ $('importFile').click(); };
  $('importFile').onchange = function(){
    var input = this;
    var f = input.files && input.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function(){
      try { importCsv(String(r.result)); } catch(e){ console.error(e); toast('Dosya okunamadı'); }
      input.value = '';
    };
    r.onerror = function(){ toast('Dosya okunamadı'); input.value = ''; };
    r.readAsText(f, 'utf-8');
  };

  $('q').oninput = render;
  $('sort').onchange = render;

  /* ---------- init ---------- */
  function setFoot(cloud){
    $('foot').textContent = cloud
      ? 'Veriler bu sayfaya kaydedilir; her cihazda aynı liste görünür.'
      : 'Veriler yalnızca bu tarayıcıda saklanır.';
  }
  spools = lsLoad(); setFoot(false); render();

  if (window.claude && window.claude.use){
    window.claude.use('db').then(function(d){
      if (!d) return;
      dbh = d; setFoot(true);
      d.collection('spools').onSnapshot(function(snap){
        spools = snap.docs.map(function(doc){
          var x = doc.data() || {};
          return {
            id: doc.id,
            brand: String(x.brand || ''),
            material: String(x.material || 'Diğer'),
            colorName: String(x.colorName || ''),
            colorHex: safeHex(String(x.colorHex || '')),
            initial: num(x.initial, 1000),
            remaining: num(x.remaining, 0),
            spoolWeight: num(x.spoolWeight, 0),
            price: num(x.price, 0),
            note: String(x.note || ''),
            createdAt: num(x.createdAt, 0),
            log: normLog(x.log)
          };
        });
        render();
      }, function(err){
        console.error(err);
        dbh = null; setFoot(false);
      });
    }).catch(function(){});
  }
})();
</script>
</body>
